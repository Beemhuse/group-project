<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/notfound.css">
    <link rel="icon" href="/Images/head-logo.png">
    <link rel="icon" href="/styles/footer.css">
    <link rel="icon" href="/styles/header.css">
    <title>404 [Not found]</title>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="header-logo">
                <img src="/Images/Eudia-logo.png" alt="">
            </div>
            <nav class="header-nav">
                <ul>
                    <li><a href="/index.html">Home</a></li>
                    <li><a href="/pages/menu.html">Our Menu</a></li>
                    <li><a href="/pages/contact.html">Contact Us</a></li>
                    <button class="sign-up-button" id="sign-up-mobile">Sign In</button>
                    <button class="log-in-button" id="login-mobile">Log In</button>
                </ul>
            </nav>
            <div class="header-left-content">
                <div class="cart-container">
                <i class="fa-solid fa-cart-shopping" style="color: #000000;"></i>
                 <span id="cart-count" class="cart-count"></span>
                </div>
                <i class="fa-solid fa-lock fa-flip-horizontal" style="color: #000000;"></i>
                <div class="user">
                    <i class="fa-solid fa-user" style="color: #000;" id="user-icon"></i>
                </div>
                <button class="sign-up-button">Sign In</button>
            </div>
            <button class="hamburger">
                <div id="bar1" class="bar"></div>
                <div id="bar2" class="bar"></div>
                <div id="bar3" class="bar"></div>
            </button>
        </div>
        <div id="logoutModal" class="modal">
            <div class="modal-content">
                <h3>Are you sure you want to log out?</h3>
                <button id="confirmLogout">Yes</button>
                <button id="cancelLogout">No</button>
            </div>
        </div>
        <div class="dropdown-menu" id="dropdownMenu">
            <ul>
                <li>
                    <a href="/dashboard.html" id="dashboardLink">
                        <i class="fa-solid fa-user-tie" style="color: #fff;" id="menu-icon"></i>Dashboard
                    </a>
                </li>
                <li><a href="#" id="logoutLink">
                        <i class="fa-solid fa-arrow-right-from-bracket" style="color: #fff;" id="menu-icon"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
        </div>
    </header>
    <main>
        <section>
            <div class="not-found">
                <div class="not-found-container">
                    <img src="/Images/Sad.png" alt="">
                    <h2>404 Not found</h2>
                    <p id="notice">Your visited page not found. You may go home page.</p>
                    <button id="return">Return to homepage</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
