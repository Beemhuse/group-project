<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-1/4 bg-white p-6 shadow-lg">
            <h2 class="text-xl font-semibold mb-4">Manage My Account</h2>
            <nav class="space-y-2">
                <a href="#" class="block text-gray-600 hover:text-green-600">Dashboard</a>
                <a href="#" class="block text-green-600 font-semibold">My Profile</a>
                <a href="#" class="block text-gray-600 hover:text-green-600">Address Book</a>
                <a href="#" class="block text-gray-600 hover:text-green-600">My Payment Options</a>
            </nav>
            <h2 class="text-xl font-semibold mt-6 mb-2">My Orders</h2>
            <nav class="space-y-2">
                <a href="#" class="block text-gray-600 hover:text-green-600">Orders</a>
                <a href="#" class="block text-gray-600 hover:text-green-600">My Cancellations</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-10">
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-green-600 text-xl font-bold mb-4">Edit Your Profile</h2>
                <form class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700">First Name</label>
                        <input type="text" value="Md" class="w-full p-2 border rounded bg-gray-100" disabled>
                    </div>
                    <div>
                        <label class="block text-gray-700">Last Name</label>
                        <input type="text" value="Rimel" class="w-full p-2 border rounded bg-gray-100" disabled>
                    </div>
                    <div>
                        <label class="block text-gray-700">Email</label>
                        <input type="email" value="rimel1111@gmail.com" class="w-full p-2 border rounded bg-gray-100" disabled>
                    </div>
                    <div>
                        <label class="block text-gray-700">Address</label>
                        <input type="text" value="Kingston, 5236, United States" class="w-full p-2 border rounded bg-gray-100" disabled>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-gray-700">Password Changes</label>
                        <input type="password" placeholder="Current Password" class="w-full p-2 border rounded mb-2">
                        <input type="password" placeholder="New Password" class="w-full p-2 border rounded mb-2">
                        <input type="password" placeholder="Confirm New Password" class="w-full p-2 border rounded mb-2">
                    </div>
                    <div class="col-span-2 flex justify-between">
                        <button type="button" class="text-gray-600">Cancel</button>
                        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Save changes</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    
</body>
</html>
